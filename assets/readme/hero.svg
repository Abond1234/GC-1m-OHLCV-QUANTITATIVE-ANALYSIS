<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Quant Project 1 — CME Gold Futures Research &amp; Strategy Pipeline</title>
  <desc id="hero-desc">A dual-branch systematic research pipeline for intraday gold futures (GC/MGC): POI-based swing detection and independent statistical feature research on 3.4 million 1-minute bars.</desc>

  <defs>
    <!-- Gold vertical bar gradient -->
    <linearGradient id="goldShimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF5A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9E7B2A"/>
    </linearGradient>
    <!-- Green candle gradient -->
    <linearGradient id="greenCandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9a6a"/>
      <stop offset="100%" stop-color="#2e7050"/>
    </linearGradient>
    <!-- Red candle gradient -->
    <linearGradient id="redCandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c45a5a"/>
      <stop offset="100%" stop-color="#8a2e2e"/>
    </linearGradient>
    <!-- POI zone gradient -->
    <linearGradient id="poiZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.06"/>
    </linearGradient>
    <!-- Background subtle radial glow -->
    <radialGradient id="bgGlow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1a1608" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0d0f" stop-opacity="1"/>
    </radialGradient>
    <!-- Clip for right panel -->
    <clipPath id="rightClip">
      <rect x="640" y="20" width="540" height="320" rx="12"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGlow)"/>
  <!-- Subtle grid lines (horizontal) -->
  <line x1="56" y1="90" x2="580" y2="90" stroke="#1e2225" stroke-width="1"/>
  <line x1="56" y1="160" x2="580" y2="160" stroke="#1e2225" stroke-width="1"/>
  <line x1="56" y1="230" x2="580" y2="230" stroke="#1e2225" stroke-width="1"/>
  <line x1="56" y1="300" x2="580" y2="300" stroke="#1e2225" stroke-width="1"/>
  <!-- Vertical divider -->
  <line x1="620" y1="40" x2="620" y2="320" stroke="#2a2d30" stroke-width="1"/>

  <!-- ── Left — Title block ── -->
  <g id="title-block" transform="translate(56 48)">
    <!-- Category label -->
    <rect x="0" y="0" width="176" height="22" rx="4" fill="#1a1f22"/>
    <text x="8" y="15"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#C9A84C" letter-spacing="1.5">QUANT RESEARCH</text>

    <!-- Project name -->
    <text x="0" y="70"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="46" font-weight="700" fill="#e8e0d0" letter-spacing="-1">Quant Project</text>
    <text x="0" y="118"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="46" font-weight="700" fill="#C9A84C" letter-spacing="-1">GC / MGC</text>

    <!-- Subtitle -->
    <text x="0" y="152"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" fill="#8a8a8a">CME Gold Futures Research &amp; Strategy Pipeline</text>

    <!-- Divider rule -->
    <rect x="0" y="166" width="48" height="2" rx="1" fill="#C9A84C" opacity="0.7"/>

    <!-- Three stat pills -->
    <g transform="translate(0 184)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="140" height="36" rx="6" fill="#121618"/>
      <text x="12" y="13"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="10" fill="#6a7070" letter-spacing="0.8">BARS RESEARCHED</text>
      <text x="12" y="28"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="13" font-weight="600" fill="#e8e0d0">3,487,656</text>

      <!-- Stat 2 -->
      <rect x="150" y="0" width="110" height="36" rx="6" fill="#121618"/>
      <text x="12" y="13"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="10" fill="#6a7070" letter-spacing="0.8"
            transform="translate(150 0)">INSTRUMENTS</text>
      <text x="12" y="28"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="13" font-weight="600" fill="#e8e0d0"
            transform="translate(150 0)">GC + MGC</text>

      <!-- Stat 3 -->
      <rect x="270" y="0" width="110" height="36" rx="6" fill="#121618"/>
      <text x="12" y="13"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="10" fill="#6a7070" letter-spacing="0.8"
            transform="translate(270 0)">RESOLUTION</text>
      <text x="12" y="28"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="13" font-weight="600" fill="#e8e0d0"
            transform="translate(270 0)">1-min OHLCV</text>
    </g>

    <!-- Tag badges -->
    <g transform="translate(0 240)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#1a2a1a"/>
      <text x="8" y="14"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="10" fill="#4a9a6a">Python</text>

      <rect x="68" y="0" width="54" height="20" rx="4" fill="#1a2a1a"/>
      <text x="8" y="14"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="10" fill="#4a9a6a"
            transform="translate(68 0)">pytest</text>

      <rect x="130" y="0" width="76" height="20" rx="4" fill="#1f1a0e"/>
      <text x="8" y="14"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="10" fill="#C9A84C"
            transform="translate(130 0)">Databento</text>

      <rect x="214" y="0" width="80" height="20" rx="4" fill="#1a1a2a"/>
      <text x="8" y="14"
            font-family="ui-monospace, SFMono-Regular, monospace"
            font-size="10" fill="#7070c0"
            transform="translate(214 0)">no leakage</text>
    </g>
  </g>

  <!-- ── Right — Annotated FVG / POI Candlestick Diagram ── -->
  <g id="project-proof" transform="translate(650 30)">
    <!-- Panel label -->
    <text x="0" y="18"
          font-family="ui-monospace, SFMono-Regular, monospace"
          font-size="10" fill="#5a5a5a" letter-spacing="1.2">POI FORMATION — 3-CANDLE FVG SEQUENCE</text>

    <!-- Chart area background -->
    <rect x="0" y="26" width="490" height="270" rx="10" fill="#0d1012"/>
    <!-- Chart grid lines -->
    <line x1="0" y1="96" x2="490" y2="96" stroke="#181d20" stroke-width="1"/>
    <line x1="0" y1="161" x2="490" y2="161" stroke="#181d20" stroke-width="1"/>
    <line x1="0" y1="226" x2="490" y2="226" stroke="#181d20" stroke-width="1"/>

    <!-- Price axis labels -->
    <text x="460" y="93" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#3a3a3a" text-anchor="end">2360.0</text>
    <text x="460" y="158" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#3a3a3a" text-anchor="end">2350.0</text>
    <text x="460" y="223" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#3a3a3a" text-anchor="end">2340.0</text>

    <!-- ── Candle A — Prior bullish candle ── -->
    <g transform="translate(50 40)">
      <!-- wick -->
      <line x1="22" y1="10" x2="22" y2="220" stroke="#4a9a6a" stroke-width="1.5"/>
      <!-- body -->
      <rect x="6" y="80" width="32" height="100" rx="2" fill="url(#greenCandle)"/>
      <!-- label -->
      <text x="22" y="240" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#5a5a5a" text-anchor="middle">A</text>
      <text x="22" y="255" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">Prior</text>
    </g>

    <!-- ── Candle B — Displacement / middle candle (the POI) ── -->
    <g transform="translate(150 40)">
      <!-- Strong bullish displacement candle with very small wicks -->
      <line x1="22" y1="18" x2="22" y2="30" stroke="#C9A84C" stroke-width="1.5"/>
      <line x1="22" y1="175" x2="22" y2="195" stroke="#C9A84C" stroke-width="1.5"/>
      <!-- body — tall gold candle (displacement) -->
      <rect x="6" y="30" width="32" height="145" rx="2" fill="url(#goldShimmer)" opacity="0.95"/>
      <!-- POI range highlight — full body of middle candle = POI zone -->
      <rect x="-10" y="30" width="520" height="145" rx="0" fill="url(#poiZone)" clip-path="url(#rightClip)"/>
      <!-- POI boundary lines -->
      <line x1="-10" y1="30" x2="510" y2="30" stroke="#C9A84C" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <line x1="-10" y1="175" x2="510" y2="175" stroke="#C9A84C" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <!-- label -->
      <text x="22" y="240" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#C9A84C" text-anchor="middle">B</text>
      <text x="22" y="255" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#C9A84C" text-anchor="middle">POI</text>
    </g>

    <!-- ── Candle C — Confirmation candle ── -->
    <g transform="translate(250 40)">
      <!-- body -->
      <line x1="22" y1="15" x2="22" y2="28" stroke="#4a9a6a" stroke-width="1.5"/>
      <line x1="22" y1="120" x2="22" y2="145" stroke="#4a9a6a" stroke-width="1.5"/>
      <rect x="6" y="28" width="32" height="92" rx="2" fill="url(#greenCandle)"/>
      <!-- label -->
      <text x="22" y="240" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#5a5a5a" text-anchor="middle">C</text>
      <text x="22" y="255" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">Confirm</text>
    </g>

    <!-- ── Candle D — Retest candle touching POI ── -->
    <g transform="translate(350 40)">
      <!-- retest — bearish pullback into POI zone, wick touching boundary -->
      <line x1="22" y1="60" x2="22" y2="180" stroke="#c45a5a" stroke-width="1.5"/>
      <rect x="6" y="60" width="32" height="70" rx="2" fill="url(#redCandle)" opacity="0.9"/>
      <!-- Retest touch highlight -->
      <circle cx="22" cy="180" r="4" fill="#C9A84C" opacity="0.9"/>
      <!-- label -->
      <text x="22" y="240" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#5a5a5a" text-anchor="middle">D</text>
      <text x="22" y="255" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">Retest</text>
    </g>

    <!-- POI zone annotation (right side) -->
    <g transform="translate(395 40)">
      <!-- POI label -->
      <rect x="10" y="72" width="72" height="42" rx="5" fill="#1a1608" stroke="#C9A84C" stroke-width="0.8" opacity="0.9"/>
      <text x="46" y="89" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#C9A84C" text-anchor="middle" letter-spacing="0.5">POI ZONE</text>
      <text x="46" y="104" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#8a7040" text-anchor="middle">high ↔ low</text>
      <!-- bracket line to POI boundaries -->
      <line x1="6" y1="30" x2="10" y2="30" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
      <line x1="6" y1="175" x2="10" y2="175" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
      <line x1="6" y1="30" x2="6" y2="175" stroke="#C9A84C" stroke-width="0.8" opacity="0.3"/>

      <!-- Touch annotation -->
      <rect x="10" y="165" width="64" height="20" rx="4" fill="#1a1008" stroke="#c45a5a" stroke-width="0.6" opacity="0.85"/>
      <text x="42" y="179" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#c47a5a" text-anchor="middle">boundary touch</text>
    </g>

    <!-- FVG label callout -->
    <g transform="translate(150 310)">
      <rect x="0" y="-14" width="200" height="18" rx="4" fill="#141810"/>
      <text x="6" y="-2" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#4a6a4a" letter-spacing="0.8">ICT FVG + close-to-open gap → POI valid</text>
    </g>

  </g>

</svg>
